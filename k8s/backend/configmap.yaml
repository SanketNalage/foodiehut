apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: foodiehut
data:
  DATABASE_HOST: "mysql"
  DATABASE_PORT: "3306"
  DATABASE_NAME: "foodiehut"
  OTP_PROVIDER: "mock"
  DEFAULT_MOCK_OTP: "123456"
  FRONTEND_BASE_URL: "http://localhost"
  CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:30080,http://localhost:5173"
