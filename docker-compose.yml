version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: foodiehut-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${DATABASE_NAME:-foodiehut}
      MYSQL_USER: ${DATABASE_USERNAME:-foodiehut}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-foodiehut123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword123}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodiehut-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-foodiehut}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-foodiehut}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-foodiehut123}
      JWT_SECRET: ${JWT_SECRET:-FoodieHutSecureJwtKeyMustBeAtLeast256BitsLongForHmacSha256Security123!}
      OTP_PROVIDER: ${OTP_PROVIDER:-mock}
      DEFAULT_MOCK_OTP: ${DEFAULT_MOCK_OTP:-123456}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodiehut-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"

volumes:
  mysql_data:
    driver: local

